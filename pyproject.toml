
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mangafire-dl"
dynamic = ["version"]
description = "Download manga volumes and chapters from MangaFire in CBZ format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["gallery-dl>=1.32.15,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "build>=1.2,<2", "pyinstaller>=6.15,<7"]

[project.scripts]
mangafire-dl = "mangafire.cli:main"

[tool.hatch.version]
source = "regex"
path = "src/mangafire/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mangafire"]
